name: Desktop installers
on:
  push:
    branches: [main]
    paths: [app.py, desktop.py, tracker/**, web/**, data/**, requirements*.txt, packaging/**, .github/workflows/windows-installer.yml]
  workflow_dispatch:
permissions:
  contents: read
env:
  APP_VERSION: 0.3.${{ github.run_number }}
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r requirements-desktop.txt
      - name: Test application
        run: python -B -m unittest discover -s tests -v
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
      - name: Build and smoke-test Windows installer
        shell: pwsh
        run: ./packaging/build-windows.ps1 -Version $env:APP_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: dist/installer/*.exe
          if-no-files-found: error
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      MAC_ARCH: ${{ matrix.arch }}
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r requirements-desktop.txt
      - name: Test application
        run: python -B -m unittest discover -s tests -v
      - name: Build and smoke-test macOS app and DMG
        run: python packaging/build-macos.py
      - uses: actions/upload-artifact@v4
        with:
          name: installer-macos-${{ matrix.arch }}
          path: dist/installer/*.dmg
          if-no-files-found: error
  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: installers
          merge-multiple: true
      - name: Checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cd installers
          sha256sum -- *.exe *.dmg > SHA256SUMS.txt
          tag="v$APP_VERSION"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "CS Tracker $APP_VERSION — Windows & macOS" --notes 'Standalone installers: Windows x64 EXE, Apple Silicon arm64 DMG, and Intel x86_64 DMG. No separate Python installation required. macOS 14 Sonoma+ (including 14.7.3); drag the app to Applications. Mac builds are ad-hoc signed, not Developer ID signed or notarized; macOS may block first launch. Windows installer remains unsigned. Personal workspace data stays on your device and is preserved on updates/uninstall.'
          fi
          gh release upload "$tag" --clobber -- *.exe *.dmg SHA256SUMS.txt
